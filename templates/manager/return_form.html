
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Return Request</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-6">

                <!-- HEADER -->
                <div class="mb-4">
                    <h2 class="fw-bold text-dark">Create Return Request</h2>
                    <p class="text-muted">
                        Submit a new product return request by filling in the details below.
                    </p>
                </div>

                <!-- FORM CARD -->
                <div class="card shadow-sm border-0">

                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-semibold">Product Return Details</h5>
                    </div>

                    <div class="card-body p-4">

                        <form method="POST">
                            {% csrf_token %}

                            {{ form.as_p }}

                            <div class="d-flex justify-content-between mt-4">

                                <a href="{% url 'manager-return-list' %}"
                                   class="btn btn-outline-secondary">
                                    Back to Returns
                                </a>

                                <button type="submit" class="btn btn-primary">
                                    Create Request
                                </button>

                            </div>

                        </form>

                    </div>
                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
